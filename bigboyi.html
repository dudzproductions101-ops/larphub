<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Randomized Cursor Maze</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121214;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .header {
      margin-bottom: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      color: #6366f1;
      margin-bottom: 4px;
    }

    .header p {
      color: #a1a1aa;
      font-size: 0.95rem;
    }

    .game-container {
      position: relative;
      width: 600px;
      height: 400px;
      background-color: #18181b;
      border: 3px solid #3f3f46;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      cursor: crosshair;
    }

    canvas {
      display: block;
      border-radius: 5px;
    }

    /* Start and Exit Zones */
    .zone {
      position: absolute;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    #start {
      top: 0;
      left: 0;
      background-color: #3b82f6;
      color: #ffffff;
      z-index: 2;
    }

    #exit {
      bottom: 0;
      right: 0;
      background-color: #10b981;
      color: #ffffff;
      z-index: 2;
      opacity: 0.5;
      pointer-events: none;
    }

    #exit.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 9, 11, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .overlay.win h2 { color: #10b981; }
    .overlay.lose h2 { color: #ef4444; }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover { background-color: #4338ca; }
    .btn:active { transform: scale(0.98); }

    .status {
      margin-top: 12px;
      font-size: 1.05rem;
      font-weight: 500;
      height: 24px;
      color: #e4e4e7;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Randomized Cursor Maze</h1>
    <p>Hover over <strong>START</strong> to begin, then find the path to the <strong>EXIT</strong>!</p>
  </div>

  <div class="game-container" id="game-container">
    <div id="start" class="zone">START</div>
    <div id="exit" class="zone">EXIT</div>
    <canvas id="mazeCanvas" width="600" height="400"></canvas>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Game Over</h2>
      <p id="overlay-msg">You touched a wall!</p>
      <div class="controls">
        <button class="btn" onclick="retryMaze()">Try Again</button>
        <button class="btn" style="background-color: #27272a;" onclick="generateNewMaze()">New Maze</button>
      </div>
    </div>
  </div>

  <div class="status" id="status-text">Hover over START to begin</div>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const container = document.getElementById('game-container');
    const startZone = document.getElementById('start');
    const exitZone = document.getElementById('exit');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const statusText = document.getElementById('status-text');

    const width = 600;
    const height = 400;
    const cols = 15;
    const rows = 10;
    const cellW = width / cols;
    const cellH = height / rows;

    let grid = [];
    let isPlaying = false;

    class Cell {
      constructor(c, r) {
        this.c = c;
        this.r = r;
        // Top, Right, Bottom, Left
        this.walls = [true, true, true, true];
        this.visited = false;
      }

      checkNeighbors() {
        let neighbors = [];
        let { c, r } = this;

        let top    = grid[index(c, r - 1)];
        let right  = grid[index(c + 1, r)];
        let bottom = grid[index(c, r + 1)];
        let left   = grid[index(c - 1, r)];

        if (top && !top.visited) neighbors.push(top);
        if (right && !right.visited) neighbors.push(right);
        if (bottom && !bottom.visited) neighbors.push(bottom);
        if (left && !left.visited) neighbors.push(left);

        if (neighbors.length > 0) {
          let rIdx = Math.floor(Math.random() * neighbors.length);
          return neighbors[rIdx];
        }
        return undefined;
      }
    }

    function index(c, r) {
      if (c < 0 || r < 0 || c >= cols || r >= rows) return -1;
      return c + r * cols;
    }

    function removeWalls(a, b) {
      let x = a.c - b.c;
      if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
      else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }

      let y = a.r - b.r;
      if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
      else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
    }

    // Depth-First Search Maze Generator
    function generateMaze() {
      grid = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          grid.push(new Cell(c, r));
        }
      }

      let current = grid[0];
      current.visited = true;
      let stack = [];

      while (true) {
        let next = current.checkNeighbors();
        if (next) {
          next.visited = true;
          stack.push(current);
          removeWalls(current, next);
          current = next;
        } else if (stack.length > 0) {
          current = stack.pop();
        } else {
          break;
        }
      }
      drawMaze();
    }

    function drawMaze() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#18181b';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#ef4444'; // Red obstacle walls
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';

      for (let cell of grid) {
        let x = cell.c * cellW;
        let y = cell.r * cellH;

        ctx.beginPath();
        if (cell.walls[0]) { ctx.moveTo(x, y); ctx.lineTo(x + cellW, y); } // Top
        if (cell.walls[1]) { ctx.moveTo(x + cellW, y); ctx.lineTo(x + cellW, y + cellH); } // Right
        if (cell.walls[2]) { ctx.moveTo(x + cellW, y + cellH); ctx.lineTo(x, y + cellH); } // Bottom
        if (cell.walls[3]) { ctx.moveTo(x, y + cellH); ctx.lineTo(x, y); } // Left
        ctx.stroke();
      }
    }

    // Collision Detection using Canvas pixel reading
    function checkCollision(e) {
      if (!isPlaying) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Ensure cursor is within canvas limits
      if (x < 0 || y < 0 || x >= width || y >= height) {
        endGame(false, "You moved outside the maze!");
        return;
      }

      // Read a 3x3 pixel grid around the cursor to catch thin walls
      const pixelData = ctx.getImageData(x - 1, y - 1, 3, 3).data;
      for (let i = 0; i < pixelData.length; i += 4) {
        let r = pixelData[i];
        let g = pixelData[i + 1];
        let b = pixelData[i + 2];

        // Detect Red Wall pixels (r > 150, low g & b)
        if (r > 150 && g < 100 && b < 100) {
          endGame(false, "You hit a wall!");
          break;
        }
      }
    }

    // Event Listeners
    startZone.addEventListener('mouseenter', () => {
      if (!isPlaying) {
        isPlaying = true;
        exitZone.classList.add('active');
        statusText.textContent = "Navigate to the EXIT!";
        statusText.style.color = "#3b82f6";
      }
    });

    exitZone.addEventListener('mouseenter', () => {
      if (isPlaying) {
        endGame(true);
      }
    });

    container.addEventListener('mousemove', checkCollision);
    container.addEventListener('mouseleave', () => {
      if (isPlaying) {
        endGame(false, "You left the game area!");
      }
    });

    function endGame(isWin, customMsg) {
      isPlaying = false;
      exitZone.classList.remove('active');
      overlay.classList.add('visible');

      if (isWin) {
        overlay.className = "overlay visible win";
        overlayTitle.textContent = "Level Cleared!";
        overlayMsg.textContent = "You successfully found the exit!";
        statusText.textContent = "Victory!";
        statusText.style.color = "#10b981";
      } else {
        overlay.className = "overlay visible lose";
        overlayTitle.textContent = "Game Over";
        overlayMsg.textContent = customMsg || "You touched a wall!";
        statusText.textContent = "Failed. Try again!";
        statusText.style.color = "#ef4444";
      }
    }

    function retryMaze() {
      overlay.classList.remove('visible');
      statusText.textContent = "Hover over START to begin";
      statusText.style.color = "#e4e4e7";
    }

    function generateNewMaze() {
      retryMaze();
      generateMaze();
    }

    // Initialize on load
    generateMaze();
  </script>
</body>
</html>
